# Tool Chaining Tests (Tier 2)
#
# Tests multi-step reasoning with tool sequences.
# Target: 75%+ pass rate for production-ready models.

suite:
  name: tool_chaining
  description: Multi-step tool usage and result synthesis
  tier: 2

tests:
  - id: chain_01
    name: Two-step calculation
    category: chaining
    prompt: "First calculate 10 * 5, then add 7 to that result. Show your work using the calculator."
    tools: [calculator]
    expect:
      contains: "57"
      min_steps: 2
    timeout: 45

  - id: chain_02
    name: Calculation then count
    category: chaining
    prompt: "Calculate 3 * 4 using calculator, then count the words in 'The answer is twelve'"
    tools: [calculator, word_counter]
    expect:
      contains: "12"
      contains: "4"
    timeout: 45

  - id: chain_03
    name: Conditional tool use
    category: conditional
    prompt: "Calculate 100 / 5. If the result is greater than 15, also calculate 20 + 5."
    tools: [calculator]
    expect:
      contains: "20"
      contains: "25"
    timeout: 45

  - id: chain_04
    name: Sequential dependencies
    category: chaining
    prompt: "Calculate 8 * 8, then use that result to calculate (previous result) / 4"
    tools: [calculator]
    expect:
      contains: "64"
      contains: "16"
    timeout: 60

  - id: chain_05
    name: Result aggregation
    category: aggregation
    prompt: "Count words in 'hello world' and 'foo bar baz'. What's the total word count?"
    tools: [word_counter, calculator]
    expect:
      contains: "5"
    timeout: 45
