# Tool Calling Tests (Tier 1)
#
# Tests single tool invocation capabilities.
# Target: 95%+ pass rate for production-ready models.

suite:
  name: tool_calling
  description: Single tool invocation and argument passing
  tier: 1

tests:
  - id: tc_01
    name: Simple calculator
    category: tool_use
    prompt: "Use the calculator to compute 15 * 7"
    tools: [calculator]
    expect:
      tool_called: calculator
      contains: "105"
    timeout: 30

  - id: tc_02
    name: Calculator with context
    category: tool_use
    prompt: "I need to split $240 among 8 people. Use calculator to find how much each person gets."
    tools: [calculator]
    expect:
      tool_called: calculator
      contains: "30"
    timeout: 30

  - id: tc_03
    name: Multi-argument tool
    category: tool_use
    prompt: "Convert 100 degrees Fahrenheit to Celsius using the temperature converter."
    tools: [temperature_converter]
    expect:
      tool_called: temperature_converter
    timeout: 30

  - id: tc_04
    name: Tool with string argument
    category: tool_use
    prompt: "Use the word_counter tool to count words in 'Hello world how are you'"
    tools: [word_counter]
    expect:
      tool_called: word_counter
      contains: "5"
    timeout: 30

  - id: tc_05
    name: Tool selection from multiple
    category: tool_selection
    prompt: "I want to multiply 6 times 9. Use the appropriate tool."
    tools: [calculator, word_counter]
    expect:
      tool_called: calculator
      contains: "54"
    timeout: 30

  - id: tc_06
    name: Explicit tool instruction
    category: tool_use
    prompt: "You MUST use the calculator tool to find 100 / 4. Do not answer without using the tool."
    tools: [calculator]
    expect:
      tool_called: calculator
      contains: "25"
    timeout: 30

  - id: tc_07
    name: Float arithmetic
    category: tool_use
    prompt: "Use calculator to compute 3.14 * 2"
    tools: [calculator]
    expect:
      tool_called: calculator
      contains: "6.28"
    timeout: 30

  - id: tc_08
    name: Negative numbers
    category: tool_use
    prompt: "Use calculator: -5 + 3"
    tools: [calculator]
    expect:
      tool_called: calculator
      contains: "-2"
    timeout: 30
